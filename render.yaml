services:
  - type: web
    name: golden-friendship-lodge
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: lodge-production
      - key: SERVICE_ROLE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: lodge-db
          property: connectionString
      - key: LODGE_ADMIN_EMAIL
        sync: false
      - key: LODGE_ADMIN_PASSWORD
        sync: false
  - type: worker
    name: golden-friendship-lodge-mail
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: lodge-production
      - key: SERVICE_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: lodge-db
          property: connectionString

databases:
  - name: lodge-db
    region: singapore
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: mason
    user: mason

envVarGroups:
  - name: lodge-production
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: prefer
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_DOMAIN
        value: "null"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MEDIA_DISK
        value: r2
      - key: MAIL_MAILER
        value: mailtrap_api
      - key: MAIL_TIMEOUT
        value: "15"
      - key: MAIL_FROM_NAME
        value: Golden Friendship Lodge
      # Add shared secrets and URL values manually to this group before deploying.
